name: Telegram Scheduled Sender

on:
  workflow_dispatch: {}  # cron-job.org صدا می‌زنه؛ فاصله ارسال رو خود send.py از schedule.json کنترل می‌کنه

concurrency:
  group: meow-sender
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install telethon

      - name: Send message (if due)
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send.py

      - name: Save last-sent state
        run: |
          git config user.name "meow-sender"
          git config user.email "meow-sender@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged — no commit"
          else
            git commit -m "Update last-sent time"
            git push
          fi
